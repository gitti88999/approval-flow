name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  # Layer 1 & 2: unit + integration — fast, mocked-Dapr tests, independently selectable via
  # `pytest -m unit` / `pytest -m integration` (see pytest.ini). Both run together here since
  # neither needs the live stack; split into separate steps so a failure clearly names its layer.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install service dependencies
        run: |
          pip install -r services/ingestion_service/requirements.txt
          pip install -r services/approval_agent/requirements.txt
          pip install -r services/payment_service/requirements.txt
          pip install -r services/gateway_service/requirements.txt

      - name: Lint (fail on syntax errors / undefined names)
        run: |
          pip install ruff
          ruff check --select=E9,F821,F822,F823 services tests scripts

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Stub LLM provider: no API key or network calls needed in CI (per assignment guidance).
          LLM_PROVIDER: stub
        run: pytest tests/ -m unit -v

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          LLM_PROVIDER: stub
        run: pytest tests/ -m integration -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet
        env:
          GROQ_API_KEY: dummy-key-for-ci
          JWT_SECRET: dummy-secret-for-ci

      - name: Build all service images
        run: docker compose build
        env:
          GROQ_API_KEY: dummy-key-for-ci
          JWT_SECRET: dummy-secret-for-ci

  # Layer 3: end-to-end — brings up the real stack and drives it exactly like a client
  # would, over HTTP, through the gateway. Separate from the other two layers on purpose: it's
  # slow and needs Docker, so it shouldn't block a fast unit/integration signal on every push.
  e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verify.py's dependency
        run: pip install requests

      - name: Start the stack
        env:
          GROQ_API_KEY: dummy-key-for-ci
          LLM_PROVIDER: stub
          JWT_SECRET: dummy-secret-for-ci
        run: docker compose up -d --build

      - name: Wait for the gateway to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "gateway never became healthy" >&2
          exit 1

      - name: Run the end-to-end verification suite
        run: python scripts/verify.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
