version: '3.8'

services:
  redis:
    image: "redis:alpine"
    restart: unless-stopped
    networks:
      - approval-network

  redis-init:
    image: "redis:alpine"
    networks:
      - approval-network
    depends_on:
      - redis
    command: >
      sh -c "until redis-cli -h redis ping | grep -q PONG; do sleep 1; done;
             redis-cli -h redis SET config-policy_rules '{\"autonomy_settings\": {\"ceiling_usd\": 250, \"confidence_threshold\": 0.80, \"hard_stops\": [\"GLOBAL-VENDOR\", \"GLOBAL-FX\", \"GLOBAL-MATH\", \"GLOBAL-FRAUD\", \"GLOBAL-RECEIPT\"]}, \"rules\": {\"MEAL-01\": {\"limit\": 75, \"fields\": [\"attendee_count\"], \"description\": \"Personal/team meals reimbursable up to \$75/attendee.\"}, \"MEAL-02\": {\"limit\": 500, \"fields\": [\"business_justification\", \"client_name\"], \"description\": \"Client entertainment over \$500 requires justification.\"}, \"TRAVEL-01\": {\"description\": \"Economy flights, standard hotels, and standard ground transport are eligible.\"}, \"TRAVEL-02\": {\"limit\": 1500, \"action\": \"human_approval\", \"description\": \"Travel over \$1,500 requires manager approval.\"}, \"TRAVEL-03\": {\"action\": \"human_approval\", \"description\": \"First/business-class travel always requires approval.\"}, \"SAAS-01\": {\"limit\": 200, \"description\": \"Subscriptions eligible up to \$200/month.\"}, \"HW-01\": {\"limit\": 1000, \"description\": \"Hardware purchases eligible up to \$1,000.\"}, \"HW-02\": {\"limit\": 1000, \"action\": \"human_approval\", \"description\": \"Hardware over \$1,000 is Capital expense.\"}}}'"
  ingestion-service:
    build: ./services/ingestion_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - approval-network
    depends_on:
      - redis

  ingestion-service-dapr:
    image: "daprio/daprd:1.11.0"
    restart: unless-stopped
    command: [
      "./daprd",
      "-app-id", "ingestion_service",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-components-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    networks:
      - approval-network
    depends_on:
      - ingestion-service

  approval-agent:
    build: ./services/approval_agent
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DAPR_HTTP_HOST=approval-agent-dapr
      - DAPR_HTTP_PORT=3500
    networks:
      - approval-network
    depends_on:
      - redis
      - redis-init

  approval-agent-dapr:
    image: "daprio/daprd:1.11.0"
    restart: unless-stopped
    command: [
      "./daprd",
      "-app-id", "approval-agent",
      "-app-port", "8001",
      "-app-channel-address", "approval-agent",
      "-dapr-http-port", "3500",
      "-components-path", "/components"
    ]
    volumes:
      - ./dapr/components:/components
    networks:
      - approval-network
    depends_on:
      - approval-agent

networks:
  approval-network:
    driver: bridge
